name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - if: matrix.node == 22
        run: npm run fmt:check
      - run: npm test

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - id: gate
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'

          const before = process.env.BEFORE ?? ''
          const current = JSON.parse(readFileSync('package.json', 'utf8')).version
          let publish = false
          if (before !== '0000000000000000000000000000000000000000') {
            try {
              const shown = execFileSync('git', ['show', `${before}:package.json`], {
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'pipe'],
              })
              const previous = JSON.parse(shown).version
              publish = previous !== current && !current.includes('-')
            } catch {
              publish = false
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${publish}\n`)
          EOF
      # ponytail: no registry-url — setup-node's empty _authToken skips OIDC. npm >= 11.5.1; Node 22 ships npm 10.
      - if: steps.gate.outputs.publish == 'true'
        run: |
          npm install -g npm@11
          npm ci
          npm publish --provenance
